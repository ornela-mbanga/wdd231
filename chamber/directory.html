<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Brazzaville Chamber of Commerce business directory. Discover local businesses and organizations in Brazzaville.">

    <meta name="author" content="Ornela Mbanga">

    <meta property="og:title"
        content="Brazzaville Chamber of Commerce | Directory">

    <meta property="og:description"
        content="Discover businesses and organizations in Brazzaville.">

    <meta property="og:type" content="website">

    <meta property="og:image"
        content="https://ornela-mbanga.github.io/wdd231/chamber/images/logo2.png">

    <meta property="og:url" content="https://ornela-mbanga.github.io/wdd231/chamber/directory.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">

    <title>Brazzaville Chamber of Commerce | Directory</title>

    <link rel="icon" href="images/favicon.png">

    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css">

    <script src="scripts/directory.js" defer></script>
    <script src="scripts/date.js" defer></script>
</head>

<body>

    <header>

        <img src="images/logo2.png"
            alt="Brazzaville Chamber of Commerce logo">

        <button id="menu-button"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false">
            ☰
        </button>

        <nav>
            <a href="index.html">Home</a>
            <a href="discover.html">Discover</a>
            <a href="directory.html"
                class="active"
                aria-current="page">
                Directory
            </a>
            <a href="join.html">Join</a>
        </nav>

    </header>

    <main>

        <h1>Business Directory</h1>

        <div class="view-buttons">

            <button id="grid-button"
                type="button"
                aria-label="Display businesses in grid view">
                Grid
            </button>

            <button id="list-button"
                type="button"
                aria-label="Display businesses in list view">
                List
            </button>

        </div>

        <section id="members-container" class="grid">

            <!-- Business cards will be generated by JavaScript -->

        </section>

    </main>

    <footer>

        <p>
            Brazzaville Chamber of Commerce
        </p>

        <p>
            Email: info@brazzavillechamber.org
        </p>

        <p>
            &copy; <span id="current-year"></span>
            Brazzaville Chamber of Commerce
        </p>

        <p>
            Ornela Mbanga | WDD 231
        </p>

        <p>

            <span id="last-modified"></span>
        </p>
